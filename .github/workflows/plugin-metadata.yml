name: Plugin metadata audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit metadata or create safe pull requests"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - pr

      repository:
        description: "Plugin repository to process, or all"
        required: true
        default: maps
        type: string

      max_prs:
        description: "Maximum PRs when using pr + all"
        required: true
        default: "15"
        type: string

  schedule:
    # Weekly read-only audit.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: >-
    plugin-metadata-${{
      github.event_name
    }}-${{
      inputs.mode || 'audit'
    }}-${{
      inputs.repository || 'all'
    }}
  cancel-in-progress: false

jobs:
  plugin-metadata:
    name: Audit Geeklog plugin metadata

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      PLUGIN_METADATA_ORG: Geeklog-Plugins

      PLUGIN_METADATA_MODE: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.mode
            || 'audit' }}

      PLUGIN_METADATA_REPOSITORY: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.repository
            || 'all' }}

      PLUGIN_METADATA_MAX_PRS: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.max_prs
            || '15' }}

      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout organization automation
        uses: actions/checkout@v5

      - name: Verify metadata scripts
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f scripts/plugin_metadata.py ]; then
            echo "::error::scripts/plugin_metadata.py was not found."
            exit 1
          fi

          if [ ! -f scripts/plugin_metadata_batch.py ]; then
            echo "::error::scripts/plugin_metadata_batch.py was not found."
            exit 1
          fi

          python3 --version

          python3 -m py_compile \
            scripts/plugin_metadata.py \
            scripts/plugin_metadata_batch.py

          echo "Plugin metadata scripts are available and syntactically valid."

      - name: Validate workflow inputs
        shell: bash
        env:
          PLUGIN_METADATA_TOKEN: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.mode == 'pr'
                && secrets.PLUGIN_METADATA_TOKEN
                || '' }}
        run: |
          set -euo pipefail

          if [ -z "$PLUGIN_METADATA_REPOSITORY" ]; then
            echo "::error::Repository filter is empty."
            exit 1
          fi

          if [ "$PLUGIN_METADATA_MODE" != "audit" ] \
             && [ "$PLUGIN_METADATA_MODE" != "pr" ]; then
            echo "::error::Unsupported mode: $PLUGIN_METADATA_MODE"
            exit 1
          fi

          if ! printf '%s' "$PLUGIN_METADATA_MAX_PRS" \
              | grep -Eq '^[0-9]+$'; then
            echo "::error::max_prs must be a positive integer."
            exit 1
          fi

          if [ "$PLUGIN_METADATA_MAX_PRS" -lt 1 ]; then
            echo "::error::max_prs must be at least 1."
            exit 1
          fi

          if [ "$PLUGIN_METADATA_MAX_PRS" -gt 25 ]; then
            echo "::error::max_prs cannot exceed 25."
            exit 1
          fi

          if [ "$PLUGIN_METADATA_MODE" = "pr" ]; then
            if [ -z "$PLUGIN_METADATA_TOKEN" ]; then
              echo "::error::PLUGIN_METADATA_TOKEN is required for PR mode."
              exit 1
            fi
          fi

          echo "Mode: $PLUGIN_METADATA_MODE"
          echo "Repository: $PLUGIN_METADATA_REPOSITORY"

          if [ "$PLUGIN_METADATA_MODE" = "pr" ] \
             && [ "$PLUGIN_METADATA_REPOSITORY" = "all" ]; then
            echo "Batch PR limit: $PLUGIN_METADATA_MAX_PRS"
          fi

      - name: Run plugin metadata audit
        shell: bash
        env:
          PLUGIN_METADATA_TOKEN: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.mode == 'pr'
                && secrets.PLUGIN_METADATA_TOKEN
                || '' }}
        run: |
          set -euo pipefail

          if [ "$PLUGIN_METADATA_MODE" = "pr" ] \
             && [ "$PLUGIN_METADATA_REPOSITORY" = "all" ]; then

            echo "Running safe batch PR mode."

            python3 scripts/plugin_metadata_batch.py \
              --org "$PLUGIN_METADATA_ORG" \
              --max-prs "$PLUGIN_METADATA_MAX_PRS" \
              --report PLUGIN_METADATA_REPORT.md

          else

            python3 scripts/plugin_metadata.py \
              --org "$PLUGIN_METADATA_ORG" \
              --mode "$PLUGIN_METADATA_MODE" \
              --repository "$PLUGIN_METADATA_REPOSITORY" \
              --report PLUGIN_METADATA_REPORT.md

          fi

      - name: Show report
        if: always()
        shell: bash
        run: |
          if [ -f PLUGIN_METADATA_REPORT.md ]; then
            echo "----- Plugin metadata report -----"
            cat PLUGIN_METADATA_REPORT.md
          else
            echo "PLUGIN_METADATA_REPORT.md was not generated."
          fi

      - name: Add report to job summary
        if: always()
        shell: bash
        run: |
          if [ -f PLUGIN_METADATA_REPORT.md ]; then
            cat PLUGIN_METADATA_REPORT.md \
              >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Plugin metadata audit"
              echo
              echo "No report was generated."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-metadata-report-${{ github.run_id }}
          path: PLUGIN_METADATA_REPORT.md
          if-no-files-found: warn
          retention-days: 30
